<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="02-workflow-title 02-workflow-desc">
<title id="02-workflow-title">五步决策审查流程</title>
<desc id="02-workflow-desc">中性界定后，依次反驳、支持、证据裁决，最后给出行动和反转条件。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#526671" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1440" height="800" rx="0" fill="#F4F7F5" stroke="none"/>
<text x="72" y="60" font-size="20" fill="#087F6F" font-weight="600" font-family="Consolas, monospace">DECISION EXPERT / 02</text><text x="1368" y="60" font-size="20" fill="#142D38" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif"></text><text x="72" y="132" font-size="48" fill="#142D38" font-weight="700" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="1296">让三个视角依次发言</text><text x="72" y="184" font-size="26" fill="#526671" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="1296">顺序固定，结论开放。先检查，再判断。</text><path d="M300,360 L324,360" fill="none" stroke="#526671" stroke-width="2" marker-end="url(#arrow)"/><path d="M564,360 L588,360" fill="none" stroke="#526671" stroke-width="2" marker-end="url(#arrow)"/><path d="M828,360 L852,360" fill="none" stroke="#526671" stroke-width="2" marker-end="url(#arrow)"/><path d="M1092,360 L1116,360" fill="none" stroke="#526671" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="260" width="228" height="248" rx="12" fill="#E7EEEB" stroke="none"/><text x="96" y="304" font-size="25" fill="#087F6F" font-weight="600" font-family="Consolas, monospace">00</text><text x="96" y="362" font-size="29" fill="#142D38" font-weight="700" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="186">界定决策</text><text x="96" y="422" font-size="25" fill="#526671" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="184">目标与底线</text><text x="96" y="464" font-size="25" fill="#526671" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="184">替代与期限</text><rect x="336" y="260" width="228" height="248" rx="12" fill="#F7E7DE" stroke="none"/><text x="360" y="304" font-size="25" fill="#087F6F" font-weight="600" font-family="Consolas, monospace">01</text><text x="360" y="362" font-size="29" fill="#142D38" font-weight="700" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="186">全力反驳</text><text x="360" y="422" font-size="25" fill="#526671" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="184">遗漏与假设</text><text x="360" y="464" font-size="25" fill="#526671" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="184">损失与偏差</text><rect x="600" y="260" width="228" height="248" rx="12" fill="#E1EDF8" stroke="none"/><text x="624" y="304" font-size="25" fill="#087F6F" font-weight="600" font-family="Consolas, monospace">02</text><text x="624" y="362" font-size="29" fill="#142D38" font-weight="700" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="186">最强支持</text><text x="624" y="422" font-size="25" fill="#526671" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="184">真实的优势</text><text x="624" y="464" font-size="25" fill="#526671" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="184">成立的条件</text><rect x="864" y="260" width="228" height="248" rx="12" fill="#DBF0E7" stroke="none"/><text x="888" y="304" font-size="25" fill="#087F6F" font-weight="600" font-family="Consolas, monospace">03</text><text x="888" y="362" font-size="29" fill="#142D38" font-weight="700" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="186">证据裁决</text><text x="888" y="422" font-size="25" fill="#526671" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="184">哪边占优势</text><text x="888" y="464" font-size="25" fill="#526671" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="184">最大未知项</text><rect x="1128" y="260" width="228" height="248" rx="12" fill="#E7EEEB" stroke="none"/><text x="1152" y="304" font-size="25" fill="#087F6F" font-weight="600" font-family="Consolas, monospace">04</text><text x="1152" y="362" font-size="29" fill="#142D38" font-weight="700" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="186">行动与反转</text><text x="1152" y="422" font-size="25" fill="#526671" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="184">最小的验证</text><text x="1152" y="464" font-size="25" fill="#526671" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="184">止损与复盘</text><text x="72" y="600" font-size="37" fill="#087F6F" font-weight="700" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="1250">先反驳，不代表最后必须反对。</text><text x="72" y="656" font-size="28" fill="#526671" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="1250">新证据出现时，更新判断；不维护旧结论。</text><path d="M72,730 L1368,730" fill="none" stroke="#D7E2DE" stroke-width="2"/><text x="72" y="768" font-size="20" fill="#526671" font-weight="400" font-family="Consolas, monospace">decision_expert</text><text x="390" y="768" font-size="20" fill="#526671" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="978">中性界定可以在前；背书和最终建议必须在证据审查之后。</text>
</svg>