<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="05-reversal-title 05-reversal-desc">
<title id="05-reversal-title">双向结论反转条件</title>
<desc id="05-reversal-desc">把新证据与预先说明的标准比较，分别触发推进、必要验证或暂停退出。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#526671" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1440" height="800" rx="0" fill="#102B35" stroke="none"/>
<text x="72" y="60" font-size="20" fill="#94E3C8" font-weight="600" font-family="Consolas, monospace">DECISION EXPERT / 05</text><text x="1368" y="60" font-size="20" fill="#142D38" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif"></text><text x="72" y="132" font-size="48" fill="#F1F6F4" font-weight="700" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="1296">提前说清楚：什么会让我改主意</text><text x="72" y="184" font-size="26" fill="#BCD0D6" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="1296">把“看情况”写成可观察的条件。</text><rect x="72" y="282" width="340" height="238" rx="12" fill="#193B47" stroke="#31505A"/><text x="104" y="334" font-size="25" fill="#BCD0D6" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="272">当前判断</text><text x="104" y="393" font-size="34" fill="#F1F6F4" font-weight="700" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="276">先小规模验证</text><text x="104" y="451" font-size="24" fill="#BCD0D6" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="276">保留资金与退出选择</text><path d="M412,400 L484,400" fill="none" stroke="#BCD0D6" stroke-width="2" marker-end="url(#arrow)"/><rect x="504" y="314" width="294" height="174" rx="12" fill="#244D59" stroke="none"/><text x="532" y="363" font-size="30" fill="#F1F6F4" font-weight="700" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="238">收到新证据</text><text x="532" y="408" font-size="26" fill="#BCD0D6" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="238">与预先标准比较</text><text x="532" y="452" font-size="23" fill="#BCD0D6" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="238">标准需有依据</text><path d="M798,400 H854 M854,278 V550 M854,278 H908 M854,414 H908 M854,550 H908" fill="none" stroke="#BCD0D6" stroke-width="2"/><circle cx="854" cy="400" r="5" fill="#94E3C8"/><rect x="912" y="234" width="456" height="104" rx="10" fill="#193B47" stroke="#31505A"/><rect x="912" y="234" width="6" height="104" rx="0" fill="#94E3C8" stroke="none"/><text x="942" y="277" font-size="29" fill="#94E3C8" font-weight="700" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="392">支持条件得到验证</text><text x="942" y="315" font-size="24" fill="#BCD0D6" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="392">可考虑推进下一阶段</text><rect x="912" y="370" width="456" height="104" rx="10" fill="#193B47" stroke="#31505A"/><rect x="912" y="370" width="6" height="104" rx="0" fill="#87BDEA" stroke="none"/><text x="942" y="413" font-size="29" fill="#87BDEA" font-weight="700" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="392">证据仍不能区分</text><text x="942" y="451" font-size="24" fill="#BCD0D6" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="392">只做能改判的补充验证</text><rect x="912" y="506" width="456" height="104" rx="10" fill="#193B47" stroke="#31505A"/><rect x="912" y="506" width="6" height="104" rx="0" fill="#E79A7C" stroke="none"/><text x="942" y="549" font-size="29" fill="#E79A7C" font-weight="700" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="392">触发底线或止损</text><text x="942" y="587" font-size="24" fill="#BCD0D6" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="392">暂停、缩小或退出</text><text x="72" y="680" font-size="31" fill="#94E3C8" font-weight="600" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="1200">目标变了，也要重开评估。</text><path d="M72,730 L1368,730" fill="none" stroke="#31505A" stroke-width="2"/><text x="72" y="768" font-size="20" fill="#BCD0D6" font-weight="400" font-family="Consolas, monospace">decision_expert</text><text x="390" y="768" font-size="20" fill="#BCD0D6" font-weight="400" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" data-max-width="978">条件 → 可观察标准 → 结论变化 → 对应行动</text>
</svg>